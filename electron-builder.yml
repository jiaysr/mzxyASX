appId: com.mzxy.asx
productName: mzxy
copyright: Copyright © 2026 jiaysr

directories:
  buildResources: build
  output: dist

# 源码不进包，只保留 out/ 与生产依赖
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.gitignore,README.md,tsconfig.json}'
  - '!dist/*'

# 将来引擎包如果放进 resources/ 需要解包，asar 里的 exe 跑不起来
asarUnpack:
  - resources/**

win:
  executableName: mzxy
  # 相对 buildResources（build/）解析
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  # 更新时先把 engine/data/profile 搬出 $INSTDIR，装完再搬回（见该文件注释）
  include: build/installer-hooks.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 明珠轩辕脚本
  # 卸载时保留用户配置与日志（在 %LOCALAPPDATA%\mzxy 下，本来就不在安装目录里）
  deleteAppDataOnUninstall: false

# electron-builder 生成 latest.yml / *.blockmap 并上传到 GitHub Release
publish:
  provider: github
  owner: jiaysr
  repo: mzxyASX
  # 必须显式写 release：默认是 draft，草稿态 electron-updater 读不到
  releaseType: release
